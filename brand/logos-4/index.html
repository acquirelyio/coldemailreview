<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Logo round 4 · Cold Email Review</title>
<style>
body{margin:0;background:#e9e7e2;color:#151515;font:15px/1.5 system-ui,-apple-system,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 24px}
.l{background:#fff;border-radius:14px;margin-bottom:28px;overflow:hidden}
.hd{padding:18px 22px 4px}
.hd b{font-size:18px}.hd p{margin:4px 0 0;color:#555}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 22px}
.row img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid #eee}
.ic{display:flex;align-items:end;gap:18px;padding:0 22px 18px}
.ctx{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 22px;border-top:1px solid #eee;background:#faf9f6}
.ctx img{height:38px;width:auto}
.ctx nav{display:flex;gap:18px;font:600 13px system-ui;color:#555}
@media(max-width:700px){.row{grid-template-columns:1fr}.ctx nav{display:none}}
</style>
</head>
<body><div class="w">
<h1>Logo round 4: cut-ice style, tied to email</h1>
<script>
const L=[
 ["e","E · Crystal envelope","An envelope cut from ice, with a star stamp. The i's dot is an ice diamond."],
 ["f","F · Ice plane","A sent email as a paper plane cut from ice. The wordmark leans forward like it's moving."],
 ["g","G · Five-star mail","A cut-ice star rising out of an open envelope. The i's dot is a small star."],
 ["h","H · Ice cube mail","An ice cube with an envelope flap folded on its front. The name has a clean blade cut."]];
for(const [k,t,p] of L)document.write(`<section class="l">
<div class="hd"><b>${t}</b><p>${p}</p></div>
<div class="row"><img src="${k}.svg" alt=""><img src="${k}-dark.svg" alt=""></div>
<div class="ic"><img src="${k}-icon.svg" width="96" alt=""><img src="${k}-icon.svg" width="48" alt=""><img src="${k}-icon.svg" width="24" alt=""><img src="${k}-icon.svg" width="16" alt=""></div>
<div class="ctx"><img src="${k}.svg" alt=""><nav><span>Reviews</span><span>Best picks</span><span>Versus</span><span>Price watch</span></nav></div>
</section>`);
</script>
</div></body>
</html>
